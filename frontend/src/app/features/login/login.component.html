<div class="login-pagina">
  <div class="login-tarjeta">
    <div class="login-marca">
      <span class="login-marca__icono">Q</span>
      <div>
        <h1>Control de Gastos</h1>
        <p>Ingresa con tu cuenta para continuar</p>
      </div>
    </div>

    <!-- [formGroup]: conecta el <form> con el FormGroup del componente -->
    <!-- (ngSubmit): se dispara al enviar el formulario (botón submit o Enter) -->
    <form [formGroup]="formulario" (ngSubmit)="enviar()" class="login-form">
      <div class="campo">
        <label for="correo">Correo</label>
        <input
          id="correo"
          type="email"
          formControlName="correo"
          placeholder="tucorreo@ejemplo.com"
          autocomplete="username"
        />
        <small class="error" *ngIf="correo.invalid && correo.touched">
          Ingresa un correo válido
        </small>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <small class="error" *ngIf="password.invalid && password.touched">
          La contraseña es obligatoria
        </small>
      </div>

      <small class="error error--general" *ngIf="errorMensaje">{{ errorMensaje }}</small>

      <button type="submit" [disabled]="cargando">
        {{ cargando ? "Ingresando..." : "Ingresar" }}
      </button>
    </form>

    <div class="login-ayuda">
      <p><strong>Usuarios de prueba</strong></p>
      <p>admin&#64;controldegastos.com — Admin123</p>
      <p>usuario&#64;controldegastos.com — Usuario123</p>
    </div>
  </div>
</div>
